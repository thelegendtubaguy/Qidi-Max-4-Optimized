name: Dev branch feedback
description: Report how a dev prerelease went, good or bad.
title: "[Dev Feedback]: "
labels: ["prerelease", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the dev prerelease. Reports are useful even when everything works: they show the changes working on printers other than mine.
        See [DEVELOPMENT.md](https://github.com/thelegendtubaguy/valve-oil/blob/dev/DEVELOPMENT.md) for installing it.

  - type: dropdown
    id: result
    attributes:
      label: How did it go?
      options:
        - Everything worked
        - Worked, with something odd
        - Something failed
    validations:
      required: true

  - type: dropdown
    id: printer
    attributes:
      label: Printer
      options:
        - QIDI Max 4
        - QIDI Plus 5
        - Other (say which below)
    validations:
      required: true

  - type: textarea
    id: printer_details
    attributes:
      label: Printer details
      description: Run the block in [Printer details](https://github.com/thelegendtubaguy/valve-oil/blob/main/docs/troubleshooting.md#printer-details) over SSH and paste everything it prints. It only reads files.
      render: text
    validations:
      required: true

  - type: input
    id: dev_build
    attributes:
      label: Dev build
      description: When you installed it, or the commit shown on the [prerelease](https://github.com/thelegendtubaguy/valve-oil/releases/tag/prerelease) page at the time.
      placeholder: "Installed 2026-11-05 evening, commit 8647d57"
    validations:
      required: true

  - type: dropdown
    id: tested
    attributes:
      label: What did you test?
      multiple: true
      options:
        - Installing or updating
        - Homing, leveling, or bed mesh
        - Print start
        - Filament changes
        - QIDI Box loads and unloads
        - End of print
        - Fluidd
        - Other
    validations:
      required: true

  - type: dropdown
    id: slicer
    attributes:
      label: Slicer and start G-code
      options:
        - OrcaSlicer with the OrcaCloud bundle
        - OrcaSlicer with G-code copied from the dev branch
        - QIDI Studio with G-code copied from the dev branch
        - Didn't print
        - Other (say which below)
    validations:
      required: true

  - type: dropdown
    id: qidi_box
    attributes:
      label: QIDI Box setup
      options:
        - No QIDI Box
        - One USB Box
        - More than one USB Box
        - RS-485 Box, buffer, or filament rack
    validations:
      required: true

  - type: dropdown
    id: polar_cooler
    attributes:
      label: Polar cooler
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: input
    id: filaments
    attributes:
      label: Filaments in the print
      description: How many filaments the slicer had, how many the objects used, and which tools.
      placeholder: "4 in the slicer, 1 used by objects (filament 3)"
    validations:
      required: false

  - type: textarea
    id: filament_temperatures
    attributes:
      label: Filament profile temperatures
      description: Bed, chamber, and nozzle temperatures from the filament profile.
      placeholder: |
        Bed: 60 C
        Chamber: 0 C
        Nozzle: 220 C first layer / 215 C other layers
    validations:
      required: false

  - type: dropdown
    id: same_filament_previous_job
    attributes:
      label: Same filament as the previous print
      description: Was the filament still loaded from a previous print on this build?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: false

  - type: textarea
    id: print_result
    attributes:
      label: What happened?
      description: Walk through what the printer did. If something failed, say where, and paste exact error text.
      placeholder: |
        - Selected filament/tool:
        - Box load or reuse:
        - Nozzle cleaning and scrape:
        - Z tilt and bed mesh:
        - Prime line:
        - Final result:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and files
      description: For anything odd or failed, attach `klippy.log` from right after it, and the sliced file, zipped. See [Logs](https://github.com/thelegendtubaguy/valve-oil/blob/main/docs/troubleshooting.md#logs).
    validations:
      required: false
