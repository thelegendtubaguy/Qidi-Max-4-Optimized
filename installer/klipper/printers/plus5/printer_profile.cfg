# QIDI Plus 5 positions and calibration defaults read by the common optimized macros.

[gcode_macro _tltg_printer]
description: QIDI Plus 5 positions and QIDI's stock input shaper calibration.
variable_bed_center_x: 160
variable_bed_center_y: 160
# Where print-start filament prep leaves the toolhead for the slicer's prime line.
variable_prime_line_staging_x: 310
variable_prime_line_staging_y: 5
# Where a QIDI Box print start waits for the bed and chamber before Z tilt.
variable_z_tilt_staging_x: 15
variable_z_tilt_staging_y: 160
# QIDI's sensorless homing current for both X/Y drivers.
variable_xy_homing_current: 0.9
variable_default_shaper_type_x: "ei"
variable_default_shaper_freq_x: 54.4
variable_default_shaper_type_y: "mzv"
variable_default_shaper_freq_y: 36.2
gcode:

[screws_tilt_adjust]
screw1: 32.5,32.5
screw1_name: Front left
screw2: 287.5,32.5
screw2_name: Front right
screw3: 287.5,287.5
screw3_name: Rear right
screw4: 32.5,287.5
screw4_name: Rear left
speed: 150
horizontal_move_z: 5
screw_thread: CW-M4

# Toolhead filament sensor on this printer's THR pin; runout and insert go through the common optimized macros.

[filament_switch_sensor filament_switch_sensor]
pause_on_runout: False
runout_gcode:
  OPTIMIZED_FILAMENT_SENSOR_RUNOUT
insert_gcode:
  OPTIMIZED_FILAMENT_SENSOR_INSERTED
event_delay: 3.0
pause_delay: 0.5
switch_pin: !THR:PA1
