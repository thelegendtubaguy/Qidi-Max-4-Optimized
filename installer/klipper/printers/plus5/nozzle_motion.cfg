# QIDI Plus 5 cutter, waste chute, wiper, and rear-bed scrape moves, from QIDI's Plus 5 macros and slicer profiles.

[gcode_macro CUT_FILAMENT_1]
description: Stock cutter sequence without the stock exit dwell; leaves stock modal state for vendor callers.
gcode:
  _CG28
  M204 S10000
  {% if (printer.gcode_move.position.x) < 15 %}
    G1 X15 F9000
    G1 Y0 F9000
  {% endif %}
  G1 Y-2 F15000
  G1 X15 F15000
  G1 X-2 F5000
  G4 P1000
  G1 X-1 F1000
  G1 X-2 F5000
  G4 P1000
  G1 X15 F3000
  M83
  G1 E-4 F1000
  M400

[gcode_macro _OPTIMIZED_REAR_BED_SCRAPE]
description: Scrapes the nozzle at the rear bed.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set saved_accel = printer.toolhead.max_accel|float %}

  OPTIMIZED_MOVE_TO_TRASH
  G90
  M204 S10000
  G1 X154 F15000
  G1 Y330 F6000
  G1 Z-0.2 F480
  G91
  G1 X15 F200
  G1 Y2
  G1 X-15
  G1 Y-2
  G1 X15
  G90
  G2 I0.5 J0.5 F480
  G2 I0.5 J0.5
  G2 I0.5 J0.5
  G1 Z10
  G1 Y{km.park_y - 30} F10000
  M106 S0
  M106 P2 S0
  SET_VELOCITY_LIMIT ACCEL={saved_accel}

[gcode_macro _OPTIMIZED_START_PRE_SCRAPE_WIPE]
description: Uses the stock slicer scraper-then-silicone wipe pattern before print-start scraping.
gcode:
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_start_pre_scrape_wipe_state
  G90
  M204 S10000
  {% for i in range(2) %}
    G1 X109 F8000
    G1 X95 F5000
  {% endfor %}
  {% for i in range(3) %}
    G1 X123 F6000
    G1 X110 F6000
  {% endfor %}
  M400
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_start_pre_scrape_wipe_state

[gcode_macro _OPTIMIZED_WIPE_NOZZLE]
description: Wipes across the rear silicone wiper without extrusion.
gcode:
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_wipe_nozzle_state
  G90
  M204 S10000
  {% for i in range(4) %}
    G1 X123 F12000
    G1 X110 F12000
  {% endfor %}
  G1 X140 F12000
  M400
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_wipe_nozzle_state

[gcode_macro _OPTIMIZED_CHUTE_DROP]
description: Leaves and re-enters the chute so wiped waste drops.
gcode:
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_chute_drop_state
  G90
  M204 S10000
  # Outside X76-110, OPTIMIZED_MOVE_TO_TRASH leaves the chute and re-enters it, releasing the waste.
  G1 X140 F10000
  OPTIMIZED_MOVE_TO_TRASH
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_chute_drop_state

[gcode_macro _OPTIMIZED_CUT_FILAMENT_MOTION]
description: Stock cutter sequence without the stock exit dwell; restores accel and G-code state.
gcode:
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_cut_filament_state
  G90
  # QIDI's _CG28 is an undefined command that Klipper ignores, so the stock cut never homed.
  G28 O X Y
  M204 S10000
  {% if (printer.gcode_move.position.x) < 15 %}
    G1 X15 F9000
    G1 Y0 F9000
  {% endif %}
  G1 Y-2 F15000
  G1 X15 F15000
  G1 X-2 F5000
  G4 P1000
  G1 X-1 F1000
  G1 X-2 F5000
  G4 P1000
  G1 X15 F3000
  M83
  G1 E-4 F1000
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_cut_filament_state

[gcode_macro _OPTIMIZED_MOVE_TO_TRASH_MOTION]
description: Moves to the waste chute; restores accel and G-code state.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set opt = printer["gcode_macro _tltg_optimized_globals"] %}
  {% set saved_accel = printer.toolhead.max_accel|float %}

  SAVE_GCODE_STATE NAME=optimized_move_to_trash_state
  G90
  G28 O X Y
  M204 S10000
  {% if (printer.gcode_move.position.y) > km.print_max[1] %}
      {% if (printer.gcode_move.position.x) > 110 or (printer.gcode_move.position.x) < 76 %}
          G1 Y{km.park_y - 30} F{km.travel_speed_xy}
          G1 X{km.park_x} F{km.travel_speed_xy}
          G1 Y{km.park_y} F{opt.trash_final_approach_speed_xy}
      {% endif %}
      G1 X{km.park_x} Y{km.park_y} F{km.travel_speed_xy}
  {% else %}
      G1 Y{km.park_y - 30} F{km.travel_speed_xy}
      G1 X{km.park_x} F{km.travel_speed_xy}
      G1 Y{km.park_y} F{opt.trash_final_approach_speed_xy}
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_move_to_trash_state
