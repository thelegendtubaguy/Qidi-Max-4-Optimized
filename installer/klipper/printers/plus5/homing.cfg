# QIDI Plus 5 homing: open-loop TMC2240 X/Y home sensorless through QIDI's G28.6245197, with QIDI's homing
# current, staging moves, settle time, Y-X-Y order, and backoffs.

[gcode_macro _OPTIMIZED_PREP_XY_HOME]
description: Before a full home, sets a kinematic position, steps X/Y away from their endstops, and lets the drivers settle.
gcode:
  {% if params.SET_Z|default(0)|int %}
    SET_KINEMATIC_POSITION X=100 Y=100 Z={printer.toolhead.axis_maximum.z / 2}
    G91
    G1 Z{params.MOVE_Z|default(0)|int} F600
    G1 X-5 F2400
    G1 Y5 F2400
    G90
    G4 P2000
  {% endif %}

[gcode_macro _OPTIMIZED_HOME_Y_AND_BACKOFF]
description: Homes Y sensorless and backs off from the endstop.
gcode:
  {% set drivers = printer.configfile.settings %}
  {% set homing_current = printer["gcode_macro _tltg_printer"].xy_homing_current %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={homing_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={homing_current}
  G28.6245197 Y
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={drivers["tmc2240 stepper_x"].run_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={drivers["tmc2240 stepper_y"].run_current}
  G91
  G1 Y10 F3000
  G90
  M400

[gcode_macro _OPTIMIZED_HOME_X_AND_BACKOFF]
description: Homes X sensorless and backs off from the endstop.
gcode:
  {% set drivers = printer.configfile.settings %}
  {% set homing_current = printer["gcode_macro _tltg_printer"].xy_homing_current %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={homing_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={homing_current}
  G28.6245197 X
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={drivers["tmc2240 stepper_x"].run_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={drivers["tmc2240 stepper_y"].run_current}
  G91
  G1 X-10 F3000
  G90
  M400

[gcode_macro _OPTIMIZED_RESTORE_XY_HOMING_STATE]
description: Restores QIDI's stock shaper to an axis without one after X/Y homing.
gcode:
  _OPTIMIZED_RESTORE_INPUT_SHAPER

[gcode_macro _OPTIMIZED_HOME_Z_FROM_SAFE_POINT_RAW]
description: Moves to the Z homing point, homes Z, and lifts clear.
gcode:
  _OPTIMIZED_MOVE_TO_Z_HOME_POINT
  M400
  G28.6245197 Z
  G91
  G1 Z20 F600
  G90
  M400

[homing_override]
gcode:
  {% set homed = printer.toolhead.homed_axes|lower %}
  {% set status = params.STATUS|default("homing") %}
  {% set lazy = params.LAZY|default(('O' in params)|int)|int %}
  {% if params.AXES is defined %}
    {% set axes = 'XYZ'|select('in', params.AXES|upper|list)|join() %}
  {% else %}
    {% set axes = 'XYZ'|select('in', params)|join() %}
  {% endif %}
  {% if not axes %}
    {% set axes = 'XYZ' %}
  {% endif %}
  {% if lazy %}
    {% set axes = axes|reject('in', printer.toolhead.homed_axes|upper)|join() %}
  {% endif %}

  {% if axes %}
    SET_PRINT_SUB_STATUS SUB_STATUS={status}
    {% set has_x = 'X' in axes %}
    {% set has_y = 'Y' in axes %}
    {% set has_z = 'Z' in axes %}
    {% set xy_homed = 'x' in homed and 'y' in homed %}
    {% set full_home = has_x and has_y and has_z %}
    {% set xy_home = has_x and has_y and not has_z %}
    {% set x_only = has_x and not has_y and not has_z %}
    {% set y_only = has_y and not has_x and not has_z %}
    {% set z_only = has_z and not has_x and not has_y %}
    {% set z_needs_full = z_only and not xy_homed %}
    M400
    BED_MESH_CLEAR
    SET_VELOCITY_LIMIT ACCEL=10000
    M220 S100
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    {% if full_home or z_needs_full %}
      _OPTIMIZED_PREP_XY_HOME SET_Z=1 MOVE_Z=5
      _OPTIMIZED_HOME_Y_AND_BACKOFF
      _OPTIMIZED_HOME_X_AND_BACKOFF
      _OPTIMIZED_HOME_Y_AND_BACKOFF
      _OPTIMIZED_RESTORE_XY_HOMING_STATE
      _OPTIMIZED_HOME_Z_FROM_SAFE_POINT_RAW
      # QIDI's M84 clears this; QIDI's full home sets it.
      SET_GCODE_VARIABLE MACRO=_HOME_STATE VARIABLE=is_homed VALUE=1
    {% endif %}

    {% if xy_home %}
      _OPTIMIZED_HOME_Y_AND_BACKOFF
      _OPTIMIZED_HOME_X_AND_BACKOFF
      _OPTIMIZED_HOME_Y_AND_BACKOFF
      _OPTIMIZED_RESTORE_XY_HOMING_STATE
    {% endif %}

    {% if y_only %}
      _OPTIMIZED_HOME_Y_AND_BACKOFF
      _OPTIMIZED_RESTORE_XY_HOMING_STATE
    {% endif %}

    {% if x_only %}
      _OPTIMIZED_HOME_X_AND_BACKOFF
      _OPTIMIZED_RESTORE_XY_HOMING_STATE
    {% endif %}

    {% if z_only and xy_homed %}
      _OPTIMIZED_HOME_Z_FROM_SAFE_POINT_RAW
    {% endif %}

    {% if not (full_home or z_needs_full or xy_home or x_only or y_only or z_only) %}
      {action_raise_error("Unsupported homing axis combination. Supported requests are full home, XY, or single-axis X/Y/Z.")}
    {% endif %}
    _OPTIMIZED_RESTORE_DEFAULT_ACCEL WARN=1
  {% endif %}
