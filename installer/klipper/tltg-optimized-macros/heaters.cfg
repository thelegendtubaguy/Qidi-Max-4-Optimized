# Optimized heater wait helpers with explicit startup statuses

[gcode_macro OPTIMIZED_WAIT_HOTEND]
description: Waits for the active hotend while preserving an optimized sub-status.
gcode:
  {% set extruder = "extruder" ~ params.T|replace('0', '') if "T" in params else printer.toolhead.extruder %}
  {% set status = params.STATUS|default("extruder_heating") %}
  SET_PRINT_SUB_STATUS SUB_STATUS={status}
  _GCODE_WAIT_WRAPPER HEATER={extruder}{% for k in params if k != "STATUS" %}{' ' ~ k ~ '="' ~ params[k] ~ '"'}{% endfor %}

[gcode_macro OPTIMIZED_WAIT_BED]
description: Waits for the bed while preserving an optimized sub-status.
gcode:
  {% set status = params.STATUS|default("bed_heating") %}
  SET_PRINT_SUB_STATUS SUB_STATUS={status}
  _GCODE_WAIT_WRAPPER HEATER=heater_bed {% for k in params if k != "STATUS" %}{' ' ~ k ~ '="' ~ params[k] ~ '"'}{% endfor %}

[gcode_macro _OPTIMIZED_REPORT_BED_TEMP]
description: Reports the live bed target and temperature before print-start leveling.
gcode:
  M118 Bed temp wait reached.  Target: {printer.heater_bed.target|round(1)} Actual: {printer.heater_bed.temperature|round(1)}

[gcode_macro OPTIMIZED_WAIT_CHAMBER]
description: Waits for the chamber while preserving an optimized sub-status.
gcode:
  {% if printer["heater_generic chamber"] is defined %}
    {% if "R" in params %}
      {% set dummy = params.__setitem__("S", params.R) %}
    {% endif %}
    {% set target = params.S|default(0)|float %}
    {% set minimum = params.MINIMUM|default(0)|float %}
    {% set wait_target = ([minimum, target]|min) if minimum > 0 else ([target - 3, 0]|max) %}
    {% set status = params.STATUS|default("chamber_heating") %}
    {% if target > 0.0 %}
      SET_PRINT_SUB_STATUS SUB_STATUS={status}
      {% if printer["fan_generic chamber_circulation_fan"] is defined %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
      {% endif %}
      SET_HEATER_TEMPERATURE_SCALED HEATER=chamber TARGET={target}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={wait_target}
    {% endif %}
  {% endif %}

[gcode_macro m109.0]
description: Waits for the nozzle to heat to the target; a filament change that kept the loaded Box slot keeps its pre-change temperature instead.
gcode:
  {% set extruder = "extruder" ~ params.T|replace('0', '')
     if "T" in params else printer.toolhead.extruder %}
  {% set target = params.S|default(0)| float %}
  # Slicer filament changes call this right after T[n]. When the Box slot loaded before the
  # cut is still loaded, no new filament came in, so the change-temperature reheat is skipped.
  {% set change = printer["gcode_macro OPTIMIZED_CUT_FILAMENT"] %}
  {% set loaded_slot = ((printer.multi_color_controller|default({})).box|default({})).loaded_slot|default('')|string %}
  {% set box_slot = loaded_slot.startswith('slot') and loaded_slot[4:].isdigit() and loaded_slot[4:]|int < 16 %}
  {% set kept_slot = change.change_time >= 0
       and printer.toolhead.estimated_print_time - change.change_time < 30
       and printer.print_stats.state == "printing"
       and box_slot and change.change_slot == loaded_slot
       and printer['filament_switch_sensor filament_switch_sensor'].filament_detected %}
  {% if change.change_time >= 0 %}
    SET_GCODE_VARIABLE MACRO=OPTIMIZED_CUT_FILAMENT VARIABLE=change_time VALUE=-1
  {% endif %}
  {% if kept_slot %}
    {action_respond_info("Filament change kept %s loaded; skipping the reheat." % loaded_slot)}
    M104 S{change.change_target}
  {% elif target > 0.0 and printer[extruder].target >= target %}
    TEMPERATURE_WAIT SENSOR="{extruder}" MINIMUM={target-1}
  {% endif %}
