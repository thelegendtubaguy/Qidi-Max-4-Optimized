# Optimized motion helpers

[gcode_macro OPTIMIZED_MOVE_TO_TRASH]
variable_vendor_cut_handoff_time: -1.0
gcode:
    # OPTIMIZED_CUT_FILAMENT records a handoff when the vendor T_MANAGER flow owns a print-time cut.
    # Slicer filament changes move here next, but the vendor flow cuts first and then moves to the
    # chute itself, so skip that one move. The short window keeps a stale handoff from skipping later moves.
    {% set handoff = vendor_cut_handoff_time|float %}
    {% set skip_for_vendor_flow = handoff >= 0 and printer.toolhead.estimated_print_time - handoff < 2 %}
    {% if handoff >= 0 %}
        SET_GCODE_VARIABLE MACRO=OPTIMIZED_MOVE_TO_TRASH VARIABLE=vendor_cut_handoff_time VALUE=-1.0
    {% endif %}
    {% if not skip_for_vendor_flow %}
        _OPTIMIZED_MOVE_TO_TRASH_MOTION
    {% endif %}
