# Publishes problems to fix before printing, such as a missing input shaper
# calibration, for Fluidd's warning banner and the console.

[tltg_printer_warnings]

[gcode_macro _OPTIMIZED_PRINTER_WARNINGS]
description: Prints each active printer warning in the console.
gcode:
  {% for warning in printer.tltg_printer_warnings.warnings %}
    {action_respond_info("WARNING: %s %s" % (warning.title, warning.message))}
  {% endfor %}
