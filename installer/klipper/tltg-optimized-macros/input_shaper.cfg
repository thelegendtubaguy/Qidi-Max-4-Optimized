# Input shaper fallback
#
# An axis without an input shaper gets QIDI's stock calibration instead of
# running unshaped at full acceleration, at startup and after X/Y homing.
# Nothing is written to printer.cfg, so the next calibration replaces it.

[delayed_gcode _tltg_restore_input_shaper]
initial_duration: 1
gcode:
  _OPTIMIZED_RESTORE_INPUT_SHAPER

[gcode_macro _OPTIMIZED_RESTORE_INPUT_SHAPER]
description: Gives each axis without an input shaper QIDI's stock calibration.
gcode:
  {% set opt = printer["gcode_macro _tltg_optimized_globals"] %}
  {% set shaper = printer.tltg_macro_status.input_shaper %}
  {% if shaper.loaded %}
    {% for axis in shaper.unshaped_axes %}
      SET_INPUT_SHAPER SHAPER_TYPE_{axis|upper}={opt["default_shaper_type_" ~ axis]} SHAPER_FREQ_{axis|upper}={opt["default_shaper_freq_" ~ axis]}
    {% endfor %}
  {% endif %}
