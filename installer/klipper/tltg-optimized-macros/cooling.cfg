# Optimized cooling helpers

# Replaces QIDI's M106, which the installer removes from klipper-macros-qd/fans.cfg.
# QIDI's turned the chamber heater off whenever P3 (exhaust) was set above 0; this
# leaves the heater on and warns instead. tltg_chamber_exhaust_guard turns the
# exhaust off for the rest of the print if the chamber falls far enough behind
# that Klipper's heater check would stop the print.

[tltg_chamber_exhaust_guard]

[gcode_macro M106]
description: Sets a fan speed. P0 part cooling, P2 auxiliary, P3 exhaust, P4 polar cooler.
gcode:
    {% set p = params.P|default(0)|int %}
    {% set speed = (params.S|float / 255.0) if params.S is defined else 1 %}

    {% if p == 0 and printer["fan_generic cooling_fan"] is defined %}
        SET_FAN_SPEED FAN=cooling_fan SPEED={speed}
    {% endif %}

    {% if p == 2 and printer["fan_generic auxiliary_cooling_fan"] is defined %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={speed}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan2 SPEED={speed}
    {% endif %}

    {% if p == 3 and printer["fan_generic chamber_circulation_fan"] is defined %}
        {% set chamber_target = printer["heater_generic chamber"].target|default(0)|float if printer["heater_generic chamber"] is defined else 0 %}
        {% if speed > 0 and chamber_target > 0 and printer.tltg_chamber_exhaust_guard.stopped %}
            {action_respond_info("Exhaust fan stays off for the rest of the print so the chamber can hold its %d°C target." % (chamber_target|round|int))}
        {% else %}
            {% if speed > 0 and chamber_target > 0 and printer["fan_generic chamber_circulation_fan"].speed|float == 0 %}
                {action_respond_info("WARNING: Exhaust fan turned on at %d%% while the chamber heater is set to %d°C. The heater stays on. If your filament profile turned it on, turn off the profile's exhaust fan (air filtration) to heat the chamber fully." % ((speed * 100)|round|int, chamber_target|round|int))}
            {% endif %}
            SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={speed}
        {% endif %}
    {% endif %}

    {% if p == 4 and printer["output_pin polar_cooler"] is defined %}
        SET_PIN PIN=polar_cooler VALUE={1 if params.S is not defined or params.S|int > 0 else 0}
    {% endif %}

[gcode_macro OPTIMIZED_M1004]
description: Enable air conditioner per settings with optimized default.
gcode:
    {% set polar_cooler = printer.save_variables.variables.enable_polar_cooler|default(0) %}
    M106 P4 S{polar_cooler}

[gcode_macro OPTIMIZED_DISABLE_BOX_HEATER]
description: Disables the QIDI Box heater when the box stack is available.
gcode:
    {% set box_available = printer.tltg_macro_status.box_available %}
    {% if box_available %}
        DISABLE_BOX_HEATER
    {% endif %}

[gcode_macro OPTIMIZED_END_FAN_COOLDOWN]
description: Run chamber fan P3 after print and stop later.
variable_speed: 0
gcode:
    {% set speed = params.S|default(120)|int %}
    {% set duration = params.T|default(180)|int %}
    {% set speed = [0, [speed, 255]|min]|max %}
    {% set duration = [0, duration]|max %}

    UPDATE_DELAYED_GCODE ID=_optimized_end_fan_cooldown_off DURATION=0
    {% if speed > 0 and duration > 0 %}
        M106 P3 S{speed}
        SET_GCODE_VARIABLE MACRO=OPTIMIZED_END_FAN_COOLDOWN VARIABLE=speed VALUE={speed}
        UPDATE_DELAYED_GCODE ID=_optimized_end_fan_cooldown_off DURATION={duration}
    {% else %}
        M106 P3 S0
        SET_GCODE_VARIABLE MACRO=OPTIMIZED_END_FAN_COOLDOWN VARIABLE=speed VALUE=0
    {% endif %}

[delayed_gcode _optimized_end_fan_cooldown_off]
gcode:
    {% set print_active = printer.idle_timeout.state|string == "Printing" or (printer.virtual_sdcard|default({})).is_active|default(False) or printer.pause_resume.is_paused|default(False) %}
    {% if not print_active %}
        M106 P3 S0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=OPTIMIZED_END_FAN_COOLDOWN VARIABLE=speed VALUE=0
