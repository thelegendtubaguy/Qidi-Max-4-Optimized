# Optimized-only globals that must stay out of stock-mapped files

[gcode_macro _tltg_optimized_globals]
variable_package_version: "26.11.04.2"
variable_staggered_start_heating: False
variable_staggered_start_heating_dwell_seconds: 10
variable_homing_settle_short: 20
variable_homing_settle_long: 50
variable_z_home_randomize_enable: True
variable_z_home_randomize_radius: 10
variable_move_to_z_travel_speed_xy: 45000
variable_trash_final_approach_speed_xy: 3500
variable_rear_scrape_orient_speed_xy: 24000
variable_unshaped_accel: 10000
variable_default_shaper_type_x: "ei"
variable_default_shaper_freq_x: 54.4
variable_default_shaper_type_y: "mzv"
variable_default_shaper_freq_y: 36.2
gcode:

[delayed_gcode _tltg_optimized_startup_banner]
initial_duration: 6
gcode:
  {% set opt = printer["gcode_macro _tltg_optimized_globals"] %}
  {action_respond_info("TLTG Optimized Configs Installed v%s" | format(opt.package_version))}
  _OPTIMIZED_PRINTER_WARNINGS
