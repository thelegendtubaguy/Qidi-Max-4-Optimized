# Optimized Z offset handling

[gcode_macro _km_apply_print_offset]
description: Applies, captures, or saves the print Z offset.
variable_captured_z_offset: 0.0
variable_captured_z_offset_valid: 0
variable_print_offset_applied: 0
gcode:
  {% if params.RESET|default(0)|int %}
    {% set z = printer.save_variables.variables.z_offset|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=_km_apply_print_offset VARIABLE=captured_z_offset VALUE={z}
    SET_GCODE_VARIABLE MACRO=_km_apply_print_offset VARIABLE=captured_z_offset_valid VALUE=1
    SET_GCODE_VARIABLE MACRO=_km_apply_print_offset VARIABLE=print_offset_applied VALUE=0
    {action_respond_info("Your Z Offset will be set to: %.3f" % z)}
    SET_GCODE_OFFSET Z=0 MOVE=0
  {% elif params.SET|default(0)|int %}
    {% if captured_z_offset_valid|int %}
      {% set z = captured_z_offset|float %}
    {% else %}
      {% set z = printer.save_variables.variables.z_offset|default(0)|float %}
    {% endif %}
    SET_GCODE_OFFSET Z={z} MOVE=0
    SET_GCODE_VARIABLE MACRO=_km_apply_print_offset VARIABLE=print_offset_applied VALUE=1
  {% elif params.SAVE|default(0)|int %}
    # Before SET reapplies the captured offset, the runtime offset is the
    # temporary zero from RESET, so saving it would erase the saved offset.
    {% if not print_offset_applied|int %}
      {action_respond_info("Z offset not saved: the print ended before the saved offset was applied.")}
    {% elif printer.gcode_move.homing_origin.z < 0.5 %}
      SAVE_VARIABLE VARIABLE=z_offset VALUE={printer.gcode_move.homing_origin.z}
    {% endif %}
  {% endif %}

[gcode_macro SAVE_VARIABLE]
description: Saves variables unchanged and warns when a zero Z offset is requested.
rename_existing: _TLTG_SAVE_VARIABLE_BASE
gcode:
  {% if params.VARIABLE|default('') == 'z_offset' and params.VALUE|default('')|float(none) == 0 %}
    {% set svv = printer.save_variables.variables %}
    {% set stats = printer.print_stats|default({}) %}
    {% set status = printer.print_stats_manager|default({}) %}
    {% set offset = printer["gcode_macro _km_apply_print_offset"] %}
    {action_respond_info("WARNING: TLTG_Z_OFFSET_ZERO_REQUEST previous_saved=%r runtime_z=%r print_state=%r filename=%r qidi_main=%r qidi_sub=%r capture_valid=%r captured_z=%r rawparams=%r" % (
      svv.z_offset|default(none), printer.gcode_move.homing_origin.z,
      stats.state|default(none), stats.filename|default(none),
      status.main_status|default(none), status.sub_status|default(none),
      offset.captured_z_offset_valid, offset.captured_z_offset, rawparams))}
  {% endif %}
  _TLTG_SAVE_VARIABLE_BASE {rawparams}
